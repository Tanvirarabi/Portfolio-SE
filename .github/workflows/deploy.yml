name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue the next one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Optional: add this secret in repo settings to deliver contact-form messages directly.
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings → Pages → Source is still "Deploy from a branch", GitHub also
      # publishes the raw source on every push. Wait for that run to finish so this
      # built site is the one that stays live. With Source set to "GitHub Actions",
      # there is no such run and this step exits immediately.
      - name: Wait for the branch publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$pending" = "0" ]; then exit 0; fi
            echo "Branch publisher still running, waiting... ($attempt)"
            sleep 15
          done

      - id: deployment
        uses: actions/deploy-pages@v5
